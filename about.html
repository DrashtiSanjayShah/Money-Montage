<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline Layout</title>
  <link rel="stylesheet" href="styless.css">
</head>
<body>
  <div class="timeline">
    <div class="container left fade-slide">
      <div class="content">
        <!-- Use a placeholder image to check -->
        <img src="https://via.placeholder.com/400" alt="Image 1">
        <div class="text-box">
          <h3>Event 1</h3>
          <p>Description for event 1.</p>
        </div>
      </div>
    </div>
    
    <div class="container right fade-slide">
      <div class="content">
        <div class="text-box">
          <h3>Event 2</h3>
          <p>Description for event 2.</p>
        </div>
        <img src="images/hero.jpeg" alt="Image 2">
      </div>
    </div>
  
    <div class="container left fade-slide">
      <div class="content">
        <img src="https://via.placeholder.com/400" alt="Image 3">
        <div class="text-box">
          <h3>Event 3</h3>
          <p>Description for event 3.</p>
        </div>
      </div>
    </div>
    <div class="container right fade-slide">
      <div class="content">
        <div class="text-box">
          <h3>Event 4</h3>
          <p>Description for event 4.</p>
        </div>
        <img src="images/hero.jpeg" alt="Image 4">
      </div>
    </div>
  
    
  </div>

  <script src="scriptss.js"></script>
</body>
</html>
